name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # Typst version and checksums come from build/typst.version and build/typst.sha256, the
      # same files the Dockerfile uses.
      - name: Install Typst
        run: |
          scripts/install-typst.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...

      - name: Generated code and go.mod are up to date
        run: |
          scripts/generate.sh
          go mod tidy
          git diff --exit-code

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  proto:
    name: Protobuf lint and breaking changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          lint: true
          format: false
          breaking: ${{ github.event_name == 'pull_request' }}
          pr_comment: false

  image:
    name: Image build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: typst-renderer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bundled Typst matches build/typst.version
        run: |
          want="$(tr -d '\r\n' < build/typst.version)"
          got="$(docker run --rm --entrypoint /bin/typst typst-renderer:ci --version)"
          echo "want typst $want, got: $got"
          case "$got" in "typst $want "*) ;; *) echo "version mismatch" >&2; exit 1 ;; esac

      - name: Runs hardened (non-root, read-only, no network) and reports healthy
        run: |
          docker run -d --name renderer --read-only --network none \
            --tmpfs /tmp:rw,noexec,nosuid,size=256m typst-renderer:ci
          for _ in $(seq 1 20); do
            if docker exec renderer /bin/typst-renderer healthcheck; then exit 0; fi
            sleep 1
          done
          docker logs renderer
          exit 1

  chart:
    name: Helm chart lint and install test
    runs-on: ubuntu-latest
    env:
      CHART: charts/typst-renderer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Lint and validate the rendered manifests
        run: |
          helm lint "$CHART"
          helm lint "$CHART" -f "$CHART/ci/all-on-values.yaml"
          for values in "" "-f $CHART/ci/all-on-values.yaml"; do
            # shellcheck disable=SC2086
            helm template t "$CHART" $values \
              | go run github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0 \
                  -strict -summary
          done

      - name: Schema rejects unknown values
        run: |
          if helm template t "$CHART" --set networkPolicy.ingres.from=x >/dev/null 2>&1; then
            echo "values.schema.json did not reject a misspelled key" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: typst-renderer:ci
          cache-from: type=gha

      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: chart-test

      - name: Install the chart and check health
        run: |
          kind load docker-image typst-renderer:ci --name chart-test
          helm install renderer "$CHART" --wait --timeout 3m \
            --set image.repository=typst-renderer --set image.tag=ci --set image.pullPolicy=Never
          kubectl exec deploy/renderer-typst-renderer -- /bin/typst-renderer healthcheck
          kubectl get pods -o wide

