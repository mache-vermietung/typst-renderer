version: v2
managed:
  enabled: false
plugins:
  - local: [go, tool, -modfile=tools.mod, protoc-gen-go]
    out: .
    opt: [module=github.com/mache-vermietung/typst-renderer]
  - local: [go, tool, -modfile=tools.mod, protoc-gen-go-grpc]
    out: .
    opt: [module=github.com/mache-vermietung/typst-renderer]
