apiVersion: v1
kind: Service
metadata:
  name: {{ include "typst-renderer.fullname" . }}
  labels:
    {{- include "typst-renderer.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "typst-renderer.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      port: {{ .Values.service.port }}
      targetPort: grpc
      protocol: TCP
      appProtocol: kubernetes.io/h2c
