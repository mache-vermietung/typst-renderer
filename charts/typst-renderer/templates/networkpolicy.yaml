{{- with .Values.networkPolicy }}
{{- if .enabled }}
# The renderer needs no egress (see "Security model" in the repository README): only DNS and
# whatever networkPolicy.egress.extra allows (e.g. an OTLP collector). Ingress only to the gRPC
# port from networkPolicy.ingress.from; an empty list allows no ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "typst-renderer.fullname" $ }}
  labels:
    {{- include "typst-renderer.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "typst-renderer.selectorLabels" $ | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  {{- if .ingress.from }}
  ingress:
    - from:
        {{- toYaml .ingress.from | nindent 8 }}
      ports:
        - port: grpc
          protocol: TCP
  {{- else }}
  ingress: []
  {{- end }}
  {{- if or .dns.enabled .egress.extra }}
  egress:
    {{- if .dns.enabled }}
    - to:
        - namespaceSelector:
            {{- toYaml .dns.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .dns.podSelector | nindent 12 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- end }}
    {{- with .egress.extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- else }}
  egress: []
  {{- end }}
{{- end }}
{{- end }}
